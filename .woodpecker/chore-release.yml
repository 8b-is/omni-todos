when:
  - event: [push, pull_request, manual, cron]
    branch: [main]
  - event: tag
    ref: refs/tags/v*

steps:
  chore-polish:
    image: rust:latest
    commands:
      - rustup component add rustfmt clippy
      - ./scripts/codeberg_ci_agent.sh --chore-polish

  release-publish:
    image: rust:latest
    when:
      event: tag
      ref: refs/tags/v*
    commands:
      - rustup component add rustfmt clippy
      - ./scripts/codeberg_ci_agent.sh --release
