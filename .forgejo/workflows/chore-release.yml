name: Codeberg Chore-Polish & Release Agent

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  schedule:
    - cron: "30 5 * * *"
  workflow_dispatch:

jobs:
  chore-polish:
    name: Chore-Polish (fmt, clippy -D warnings, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: |
          rustup update stable
          rustup component add rustfmt clippy
      - name: Run Codeberg CI Chore-Polish Agent
        run: ./scripts/codeberg_ci_agent.sh --chore-polish

  release:
    name: Build & Package Release
    needs: chore-polish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Release Binary
        run: ./scripts/codeberg_ci_agent.sh --release
